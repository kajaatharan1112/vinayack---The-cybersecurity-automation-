name: CI

# Runs on every push to any branch and every PR targeting main.
# The Docker build job additionally runs on pushes/PRs to main (the release gate).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Types · Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + import order)
        run: ruff check --output-format=github .

      - name: Mypy (type check)
        run: mypy

      - name: Pytest (with coverage)
        run: pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build (release gate)
    runs-on: ubuntu-latest
    needs: quality
    # Only gate images on the main line, so feature branches stay fast.
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Build test stage (runs lint+types+tests inside the image)
        run: docker build --target test -t cybersecurity-harness:test .

      - name: Build runtime image
        run: docker build --target runtime -t cybersecurity-harness:latest .

      - name: Smoke-test the runtime image
        run: docker run --rm --network none cybersecurity-harness:latest status
