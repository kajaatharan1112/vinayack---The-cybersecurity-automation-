[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-harness"
version = "0.0.1"
description = "Government-Ready Offline Cybersecurity Harness Engine (Phase 0 foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# The core harness depends ONLY on the Python standard library, so it runs and
# tests fully offline with no third-party packages.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
harness = "harness.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["harness"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "SLF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]  # tests may touch internals deliberately

[tool.mypy]
python_version = "3.11"
packages = ["harness"]
ignore_missing_imports = true
warn_unused_ignores = true
